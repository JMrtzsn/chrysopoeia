<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Chrysopoeia local harness architecture</title>
  <desc id="desc">A runtime-neutral paper-trading core uses an ADK runtime adapter today, a public Polymarket market-data adapter, deterministic paper execution, and deferred platform capabilities.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718096"/></marker>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #17202a }
      .title { font-size: 26px; font-weight: 700 }
      .label { font-size: 16px; font-weight: 700 }
      .small { font-size: 13px }
      .box { stroke: #2d3748; stroke-width: 2; rx: 12 }
      .agent { fill: #dbeafe }
      .control { fill: #dcfce7 }
      .context { fill: #fef3c7 }
      .future { fill: #f3f4f6; stroke-dasharray: 7 5 }
      .flow { fill: none; stroke: #718096; stroke-width: 2; marker-end: url(#arrow) }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#faf9f6"/>
  <text x="50" y="48" class="title">CHRYSOPOEIA / LOCAL HARNESS</text>

  <rect x="50" y="80" width="250" height="110" class="box context"/>
  <text x="70" y="110" class="label">USER CONTROLS</text>
  <text x="70" y="137" class="small">bankroll / one market</text>
  <text x="70" y="159" class="small">risk / loss / model budget</text>
  <text x="70" y="181" class="small">explicit cycle trigger</text>

  <rect x="390" y="80" width="420" height="110" class="box agent"/>
  <text x="415" y="110" class="label">RUNTIME-NEUTRAL CORE</text>
  <text x="415" y="137" class="small">canonical values / contracts</text>
  <text x="415" y="159" class="small">policy / transitions / paper fill</text>
  <text x="415" y="181" class="small">audit / evaluation requirements</text>

  <rect x="900" y="80" width="250" height="110" class="box control"/>
  <text x="920" y="110" class="label">VENUE ADAPTER</text>
  <text x="920" y="137" class="small">public Polymarket data</text>
  <text x="920" y="159" class="small">metadata / CLOB depth</text>
  <text x="920" y="181" class="small">no execution authority</text>

  <path d="M300 135H390" class="flow"/><path d="M810 135H900" class="flow"/>

  <rect x="50" y="245" width="700" height="345" class="box" fill="#ffffff"/>
  <text x="75" y="278" class="label">CURRENT HARNESS GRAPH</text>
  <text x="75" y="301" class="small">explicit, one market, paper only</text>

  <rect x="80" y="330" width="130" height="65" class="box control"/><text x="100" y="368" class="label">SNAPSHOT</text>
  <rect x="260" y="330" width="130" height="65" class="box agent"/><text x="290" y="368" class="label">TRADER</text>
  <rect x="440" y="330" width="130" height="65" class="box agent"/><text x="467" y="368" class="label">PROPOSE</text>
  <rect x="620" y="330" width="100" height="65" class="box agent"/><text x="638" y="368" class="label">REVIEW</text>
  <path d="M210 362H260" class="flow"/><path d="M390 362H440" class="flow"/><path d="M570 362H620" class="flow"/>

  <rect x="80" y="445" width="190" height="95" class="box context"/>
  <text x="100" y="474" class="label">EVIDENCE</text>
  <text x="100" y="499" class="small">canonical snapshot only</text><text x="100" y="520" class="small">Search remains unverified</text>
  <path d="M325 395V420H175V445" class="flow"/>

  <rect x="330" y="445" width="170" height="95" class="box control"/>
  <text x="345" y="474" class="label">PAPER ADAPTER</text>
  <text x="350" y="499" class="small">deterministic risk</text><text x="350" y="520" class="small">simulated fill</text>
  <path d="M670 395V420H415V445" class="flow"/>

  <rect x="560" y="445" width="160" height="95" class="box control"/>
  <text x="583" y="474" class="label">EVALUATE</text>
  <text x="580" y="499" class="small">audit / cost ledger</text><text x="580" y="520" class="small">deterministic eval</text>
  <path d="M500 492H560" class="flow"/><path d="M640 540V565H505V395" class="flow"/>

  <rect x="800" y="245" width="350" height="345" class="box future"/>
  <text x="825" y="278" class="label">ADAPTERS / PLATFORM</text>
  <text x="825" y="301" class="small">current edges; future optional</text>
  <rect x="835" y="330" width="280" height="45" class="box agent"/><text x="864" y="358" class="small">ADK runtime / model config</text>
  <rect x="835" y="400" width="280" height="45" class="box control"/><text x="874" y="428" class="small">idempotent scheduling</text>
  <rect x="835" y="470" width="125" height="45" class="box control"/><text x="860" y="498" class="small">RAG / memory</text>
  <rect x="990" y="470" width="125" height="45" class="box control"/><text x="1003" y="498" class="small">durable records</text>
  <rect x="835" y="540" width="280" height="45" class="box agent"/><text x="872" y="568" class="small">isolated live capability</text>
  <path d="M975 375V400" class="flow"/><path d="M975 445V462H897V470" class="flow"/><path d="M960 492H990" class="flow"/><path d="M1052 515V532H975V540" class="flow"/>
  <path d="M750 492H785V352H835" class="flow"/>

  <rect x="50" y="630" width="1100" height="55" class="box control"/>
  <text x="75" y="655" class="label">DETERMINISTIC SAFETY BOUNDARY</text>
  <text x="75" y="676" class="small">canonical state / evidence / exposure / model cost / paper fills / no agent override</text>

  <rect x="895" y="25" width="18" height="18" class="agent" stroke="#2d3748"/><text x="920" y="39" class="small">LLM agent</text>
  <rect x="1010" y="25" width="18" height="18" class="control" stroke="#2d3748"/><text x="1035" y="39" class="small">code</text>
</svg>
