[runtime]
adapter = "adk"
mode = "paper"

[venue]
adapter = "polymarket"
markets = "esports-match-winner"
paper_fee_rate = 0.02
paper_fee_source = "paper-assumption:flat-2pct-v1"

[models]
adapter = "adk-registry"
root = "openrouter/openai/gpt-4.1-mini"
context = "openrouter/openai/gpt-4.1-mini"
trader = "openrouter/openai/gpt-4.1-mini"
reviewer = "openrouter/openai/gpt-4.1-mini"

[cost]
model = "openrouter/openai/gpt-4.1-mini"
input_usd_per_million_tokens = "0.40"
output_usd_per_million_tokens = "1.60"
maximum_input_tokens_per_call = 8192
maximum_output_tokens_per_call = 1024
maximum_model_calls_per_cycle = 12

[session]
bankroll = 1000
maximum_loss = 100
target_win_rate = 0.5
window_minutes = 60
max_cycles = 1
cost_budget = "5"
interval_seconds = 300
daily_cloud_cost_budget = 5
scored_only = true

[risk]
maximum_market_exposure = 0.01
maximum_total_exposure = 0.10
market_exposure = 0
total_exposure = 0
