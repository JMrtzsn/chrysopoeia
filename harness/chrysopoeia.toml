series = "btc-updown-5m"
paper_fee_rate = 0.02
paper_fee_source = "paper-assumption:flat-2pct-v1"

[models]
location = "us"
root = "gemini-3.5-flash"
context = "gemini-3.5-flash"
trader = "gemini-3.5-flash"
