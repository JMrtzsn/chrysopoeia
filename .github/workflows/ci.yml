name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.unit }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unit: [harness, consumer, observer]
    defaults:
      run:
        working-directory: ${{ matrix.unit }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --all-groups --all-extras
      - run: uv run python -m unittest discover -s tests
      - run: uv run ruff check .
      - run: uv run ty check .
      - if: matrix.unit == 'harness'
        run: |
          uv run chrysopoeia validate --json
          uv run python -c "import chrysopoeia.agent"

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/infra-tf
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.15.0"
      - uses: terraform-linters/setup-tflint@v6
      - uses: aquasecurity/setup-trivy@v0.3.1
      - name: Install conftest
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin conftest
      - run: ./gates.sh
